<div class="admin-container">
  <div class="header-section">
    <h1>Gestione Personale</h1>
    <p class="subtitle">Gestisci i ruoli e gli accessi dello staff</p>
  </div>
  <div class="table-card">
    <table class="modern-table">
      <thead><tr><th>Cognome</th><th>Nome</th><th>Email</th><th>Ruolo</th><th>Azioni</th></tr></thead>
      <tbody>
        @for (utente of adminService.utenti(); track utente.id_utente) {
          <tr>
            <td><strong>{{ utente.cognome }}</strong></td>
            <td>{{ utente.nome }}</td>
            <td class="text-muted">{{ utente.email }}</td>
            <td><span class="badge" [class.badge-steward]="utente.ruolo === 'steward'" [class.badge-org]="utente.ruolo === 'organizzatore'" [class.badge-admin]="utente.ruolo === 'admin'">{{ utente.ruolo | uppercase }}</span></td>
            <td>
              @if (utente.ruolo === 'steward') { <button class="btn-action" (click)="promuovi(utente.id_utente)">Promuovi a Org.</button> } 
              @else { <span class="no-action">-</span> }
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
<style>
  .admin-container { padding: 30px; max-width: 1200px; margin: 0 auto; font-family: 'Segoe UI', sans-serif; }
  .header-section { margin-bottom: 30px; }
  .table-card { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); overflow: hidden; border: 1px solid #f1f3f5; }
  .modern-table { width: 100%; border-collapse: collapse; text-align: left; }
  .modern-table th { background-color: #f8f9fa; padding: 18px 24px; font-weight: 600; font-size: 13px; text-transform: uppercase; border-bottom: 2px solid #e9ecef; }
  .modern-table td { padding: 16px 24px; border-bottom: 1px solid #f1f3f5; }
  .badge { padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .badge-steward { background-color: #e3f2fd; color: #1976d2; }
  .badge-org { background-color: #e8f5e9; color: #2e7d32; }
  .badge-admin { background-color: #ffebee; color: #c62828; }
  .btn-action { background: #007bff; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
</style>
